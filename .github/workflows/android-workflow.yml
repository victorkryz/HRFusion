name: HRFusion build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-23
      POCO_VERSION: poco-1.14.2-release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build POCO for Android
        run: |
          git clone --depth 1 --branch $POCO_VERSION https://github.com/pocoproject/poco.git

          cmake -S poco -B poco-build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/poco-install \
            -DENABLE_TESTS=OFF \
            -DENABLE_SAMPLES=OFF \
            -DENABLE_PAGECOMPILER=OFF \
            -DENABLE_PAGECOMPILER_FILE2PAGE=OFF

          cmake --build poco-build --parallel
          cmake --install poco-build
