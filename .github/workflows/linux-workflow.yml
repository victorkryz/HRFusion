name: HRFusion build (debug version)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest  

    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-23
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      POCO_VERSION: poco-1.14.2-release


    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build POCO for Android
        run: |
          git clone --depth 1 --branch $POCO_VERSION https://github.com/pocoproject/poco.git

          cmake -S poco -B poco-build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=$PWD/poco-install/$ANDROID_ABI \
            -DENABLE_TESTS=OFF \
            -DENABLE_SAMPLES=OFF \
            -DENABLE_PAGECOMPILER=OFF \
            -DENABLE_PAGECOMPILER_FILE2PAGE=OFF

          cmake --build poco-build --parallel
          cmake --install poco-build

      - name: Inspect POCO install
        run: |
          find $PWD/poco-install -name "PocoConfig.cmake" -o -name "poco-config.cmake"

      - name: Inspect POCO CMake files
        run: |
          find $PWD/poco-install -name "*Poco*Config*.cmake" -o -name "*Foundation*.cmake"
          find $PWD/poco-install -type f | grep -i "Poco.*cmake"

      - name: Inspect POCO install configuration files
        run: |
          ls -l $PWD/poco-install
          ls -l $PWD/poco-install/$ANDROID_ABI
          ls -l $PWD/poco-install/$ANDROID_ABI/lib


      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
